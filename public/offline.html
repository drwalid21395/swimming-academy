<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0ea5e9">
  <title>غير متصل | أكاديمية السباحة</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Tahoma, system-ui, sans-serif; background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 55%, #06b6d4 100%); color: #fff; text-align: center; padding: 24px; }
    .box { max-width: 420px; }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.7; opacity: .92; margin: 0 0 24px; }
    button { background: #fff; color: #0369a1; border: 0; border-radius: 14px; padding: 13px 28px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🏊</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذر الوصول إلى الشبكة. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
